<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地牢切怪 - 公因數雙人對決</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-3 select-none touch-manipulation">

  <!-- 頂部資訊列 -->
  <header class="w-full max-w-sm flex items-center justify-between py-2 border-b border-slate-700/60 text-xs">
    <div class="flex items-center gap-1.5 font-bold text-amber-400">
      <span>🐉</span>
      <span>公因數雙人戰</span>
    </div>
    <div id="roomBadge" class="bg-slate-800 px-2 py-0.5 rounded text-slate-300 font-mono hidden">
      房號: <span id="displayRoomCode" class="text-amber-400 font-bold">----</span>
    </div>
  </header>

  <!-- 大廳畫面：開房 / 進房 -->
  <main id="lobbyScreen" class="w-full max-w-sm flex-1 flex flex-col justify-center items-center gap-4 my-auto">
    <div class="text-center">
      <div class="text-4xl mb-2">⚔️</div>
      <h2 class="text-xl font-black text-amber-400">雙子魔物・公因數對決</h2>
      <p class="text-xs text-slate-400 mt-1">找出能「同時整除」兩隻怪獸的神劍，砍到互質時發動斬殺！</p>
    </div>

    <!-- 開房區塊 -->
    <div class="w-full bg-slate-800/80 p-4 rounded-2xl border border-slate-700 flex flex-col gap-3">
      <button id="btnCreateRoom" onclick="createRoom()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm tracking-wide shadow-lg active:scale-95 transition-all">
        🏠 建立房間（產生 4 碼）
      </button>
      <div id="createStatus" class="text-xs text-center text-amber-300 font-mono hidden"></div>
    </div>

    <div class="text-xs text-slate-500 font-bold">— 或是 —</div>

    <!-- 加入房間區塊 -->
    <div class="w-full bg-slate-800/80 p-4 rounded-2xl border border-slate-700 flex flex-col gap-2">
      <label class="text-xs text-slate-300 font-medium">輸入對手 4 碼房號：</label>
      <div class="flex gap-2">
        <input id="inputRoomCode" type="text" maxlength="4" placeholder="例如: 8821" 
          class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-center text-lg font-bold font-mono tracking-widest uppercase focus:outline-none focus:border-amber-400">
        <button onclick="joinRoom()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm active:scale-95 transition-all">
          加入
        </button>
      </div>
      <div id="joinStatus" class="text-xs text-center text-rose-400 font-medium hidden"></div>
    </div>
  </main>

  <!-- 戰鬥畫面 (預設隱藏) -->
  <main id="battleScreen" class="w-full max-w-sm flex-1 flex flex-col justify-between hidden my-1">
    
    <!-- 對手狀態縮小條 -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-2 flex items-center justify-between text-xs">
      <span class="text-slate-400">對手進度:</span>
      <div class="flex items-center gap-2 font-mono">
        <span id="enemyNums" class="text-slate-300 font-bold">[ ?, ? ]</span>
        <span id="enemyStatus" class="text-emerald-400 text-[11px]">作戰中</span>
      </div>
    </div>

    <!-- 本地雙子怪中央顯示區 -->
    <div class="relative bg-slate-800 rounded-2xl border-2 border-slate-700 p-4 flex flex-col items-center justify-center my-2 shadow-inner">
      <div class="text-xs text-slate-400 font-medium mb-1 flex items-center gap-1">
        <span>雙子怪核心數值</span>
      </div>

      <!-- 兩個數字並列 -->
      <div class="flex items-center justify-center gap-3 my-2 w-full">
        <div class="flex-1 bg-slate-900/90 border border-amber-500/40 rounded-xl py-3 text-center shadow-lg">
          <div class="text-[10px] text-amber-300/70 font-mono">數值 A</div>
          <div id="numA" class="text-3xl font-black text-amber-400 font-mono tracking-tight">--</div>
        </div>
        <div class="text-xl font-black text-slate-500 font-mono">&</div>
        <div class="flex-1 bg-slate-900/90 border border-amber-500/40 rounded-xl py-3 text-center shadow-lg">
          <div class="text-[10px] text-amber-300/70 font-mono">數值 B</div>
          <div id="numB" class="text-3xl font-black text-amber-400 font-mono tracking-tight">--</div>
        </div>
      </div>

      <!-- 已分解公因數紀錄 -->
      <div class="text-xs text-slate-400 mt-1 flex items-center gap-1 font-mono">
        <span>已抽出的公因數:</span>
        <span id="factorsHistory" class="text-emerald-400 font-bold">無</span>
      </div>

      <!-- 彈刀 / 誤判懲罰遮罩 -->
      <div id="stunOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-1 hidden z-20">
        <div class="text-3xl animate-bounce">⚡</div>
        <div class="text-sm font-black text-rose-400">彈刀懲罰！</div>
        <div class="text-xs text-slate-300">不能同時整除，冷卻倒數: <span id="stunCount" class="font-bold text-amber-400">3</span> 秒</div>
      </div>
    </div>

    <!-- 終結技：互質斬殺大按鈕 -->
    <div class="w-full mb-2">
      <button id="btnCoprime" onclick="claimCoprime()" class="w-full py-3 bg-gradient-to-r from-amber-500 via-rose-500 to-amber-500 bg-pos-0 hover:bg-pos-100 rounded-xl font-black text-base tracking-wider text-white shadow-lg shadow-rose-950/50 border border-amber-300 active:scale-95 transition-all">
        ⚡ 雙數互質！發動終結斬殺
      </button>
      <p class="text-[10px] text-slate-400 text-center mt-1">※ 注意：若仍有大於 1 的公因數卻按下，將被重罰凍結 4 秒！</p>
    </div>

    <!-- 下方神劍操作面板 (2, 3, 5, 7) -->
    <div class="grid grid-cols-4 gap-2 w-full">
      <button onclick="slash(2)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-indigo-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[10px] text-indigo-300 font-semibold">神劍</span>
        <span class="text-2xl font-black text-indigo-400 font-mono">2</span>
      </button>
      <button onclick="slash(3)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-emerald-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[10px] text-emerald-300 font-semibold">神劍</span>
        <span class="text-2xl font-black text-emerald-400 font-mono">3</span>
      </button>
      <button onclick="slash(5)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-amber-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[10px] text-amber-300 font-semibold">神劍</span>
        <span class="text-2xl font-black text-amber-400 font-mono">5</span>
      </button>
      <button onclick="slash(7)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-rose-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[10px] text-rose-300 font-semibold">神劍</span>
        <span class="text-2xl font-black text-rose-400 font-mono">7</span>
      </button>
    </div>

  </main>

  <!-- 結算彈窗 (支援雙向確認再來一局) -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="max-w-xs w-full bg-slate-800 border-2 border-slate-700 rounded-3xl p-5 text-center flex flex-col items-center shadow-2xl">
      <div id="resultIcon" class="text-5xl mb-2">🏆</div>
      <h3 id="resultTitle" class="text-2xl font-black text-amber-400 mb-1">獲得勝利！</h3>
      <p id="resultDesc" class="text-xs text-slate-300 mb-4">你最先達成互質並完成斬殺！</p>

      <!-- 數學概念回顧 -->
      <div class="w-full bg-slate-900/90 rounded-xl p-3 border border-slate-700 text-left text-xs space-y-1 font-mono mb-4">
        <div class="text-slate-400 text-[10px]">【本題短除法總結】</div>
        <div>題目數值: <span id="summaryInitNums" class="text-amber-300 font-bold"></span></div>
        <div>最大公因數 GCD: <span id="summaryGcd" class="text-emerald-400 font-bold"></span></div>
        <div>最後互質商數: <span id="summaryRemain" class="text-slate-300 font-bold"></span></div>
      </div>

      <!-- 再戰提示狀態 -->
      <div id="rematchStatus" class="text-xs text-amber-300 font-medium mb-3 min-h-[1.25rem]"></div>

      <!-- 按鈕群 -->
      <div class="flex gap-2 w-full">
        <button id="btnRematch" onclick="requestRematch()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm active:scale-95 transition-all">
          再來一局
        </button>
        <button onclick="location.reload()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-sm text-slate-300 active:scale-95 transition-all">
          回大廳
        </button>
      </div>
    </div>
  </div>

  <footer class="w-full text-center py-1 text-[10px] text-slate-500">
    PeerJS P2P Dual GCD Engine
  </footer>

  <script>
    // 題庫設計：[numA, numB]
    const QUESTION_POOL = [
      [24, 36], [36, 48], [48, 72], [60, 90],
      [72, 108], [84, 126], [40, 100], [45, 75],
      [56, 84], [90, 120], [120, 180], [140, 210]
    ];

    let peer = null;
    let conn = null;
    let myA = 0, myB = 0;
    let initA = 0, initB = 0;
    let myFactors = [];
    let isStunned = false;
    let gameOver = false;

    // 再戰控制標記
    let rematchRequestedByMe = false;
    let rematchRequestedByPeer = false;

    // 工具：求兩數最大公因數 (歐幾里得輾轉相除法)
    function calcGcd(a, b) {
      return b === 0 ? a : calcGcd(b, a % b);
    }

    // 產生 4 碼 Peer ID
    function generate4Code() {
      return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // 開房
    function createRoom() {
      const code = generate4Code();
      const statusEl = document.getElementById('createStatus');
      statusEl.classList.remove('hidden');
      statusEl.innerText = "正在連線伺服器，分配房號...";

      peer = new Peer(code);

      peer.on('open', (id) => {
        statusEl.innerHTML = `房間已建立！你的 4 碼是：<strong class="text-amber-400 text-sm tracking-widest">${id}</strong><br>請讓對手輸入加入...`;
        document.getElementById('displayRoomCode').innerText = id;
        document.getElementById('roomBadge').classList.remove('hidden');
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
        // 房主決定題目並分發
        const q = QUESTION_POOL[Math.floor(Math.random() * QUESTION_POOL.length)];
        setTimeout(() => {
          startGame(q[0], q[1]);
          conn.send({ type: 'START', q: q });
        }, 500);
      });

      peer.on('error', (err) => {
        statusEl.innerText = "開房失敗，請再試一次或重新整理。";
      });
    }

    // 加入房間
    function joinRoom() {
      const input = document.getElementById('inputRoomCode').value.trim();
      const statusEl = document.getElementById('joinStatus');
      if (input.length !== 4) {
        statusEl.innerText = "請輸入正確的 4 位數字房號！";
        statusEl.classList.remove('hidden');
        return;
      }

      statusEl.innerText = "連線對手中...";
      statusEl.classList.remove('hidden');

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(input);
        setupConnection();
      });

      peer.on('error', (err) => {
        statusEl.innerText = "找不到該房號，請確認後重試。";
      });
    }

    // 設定連線通訊處理
    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('lobbyScreen').classList.add('hidden');
        document.getElementById('battleScreen').classList.remove('hidden');
      });

      conn.on('data', (data) => {
        if (data.type === 'START') {
          startGame(data.q[0], data.q[1]);
        } else if (data.type === 'PROGRESS') {
          document.getElementById('enemyNums').innerText = `[ ${data.a}, ${data.b} ]`;
        } else if (data.type === 'WIN') {
          triggerGameOver(false, data.finalGcd, data.lastA, data.lastB);
        } else if (data.type === 'REMATCH_REQUEST') {
          handleRematchRequest();
        } else if (data.type === 'REMATCH_START') {
          document.getElementById('resultModal').classList.add('hidden');
          startGame(data.q[0], data.q[1]);
        }
      });
    }

    // 開始遊戲初始化
    function startGame(a, b) {
      myA = a; myB = b;
      initA = a; initB = b;
      myFactors = [];
      isStunned = false;
      gameOver = false;

      // 重設再戰狀態與按鈕
      rematchRequestedByMe = false;
      rematchRequestedByPeer = false;
      const btn = document.getElementById('btnRematch');
      const statusEl = document.getElementById('rematchStatus');
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed', 'ring-2', 'ring-amber-400', 'animate-pulse');
      }
      if (statusEl) statusEl.innerText = '';

      updateUI();
    }

    function updateUI() {
      document.getElementById('numA').innerText = myA;
      document.getElementById('numB').innerText = myB;
      document.getElementById('factorsHistory').innerText = myFactors.length > 0 ? myFactors.join(' × ') : '無';
    }

    // 揮動神劍短除
    function slash(prime) {
      if (isStunned || gameOver) return;

      // 檢查是否兩者皆能整除
      if (myA % prime === 0 && myB % prime === 0) {
        myA /= prime;
        myB /= prime;
        myFactors.push(prime);
        updateUI();

        // 同步狀態給對手
        if (conn && conn.open) {
          conn.send({ type: 'PROGRESS', a: myA, b: myB });
        }
      } else {
        triggerStun(3); // 彈刀罰停 3 秒
      }
    }

    // 發動互質斬殺判定
    function claimCoprime() {
      if (isStunned || gameOver) return;

      const currentGcd = calcGcd(myA, myB);
      if (currentGcd === 1) {
        // 確實互質，成功斬殺獲勝！
        const totalGcd = myFactors.reduce((acc, val) => acc * val, 1);
        if (conn && conn.open) {
          conn.send({ type: 'WIN', finalGcd: totalGcd, lastA: myA, lastB: myB });
        }
        triggerGameOver(true, totalGcd, myA, myB);
      } else {
        // 誤判：兩數還可以再被整除，給予 4 秒懲罰！
        triggerStun(4);
      }
    }

    // 彈刀處罰倒數
    function triggerStun(seconds) {
      isStunned = true;
      const overlay = document.getElementById('stunOverlay');
      const countEl = document.getElementById('stunCount');
      overlay.classList.remove('hidden');

      let remaining = seconds;
      countEl.innerText = remaining;

      const timer = setInterval(() => {
        remaining--;
        countEl.innerText = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          overlay.classList.add('hidden');
          isStunned = false;
        }
      }, 1000);
    }

    // 遊戲結束結算
    function triggerGameOver(isWinner, finalGcd, endA, endB) {
      gameOver = true;
      const modal = document.getElementById('resultModal');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const icon = document.getElementById('resultIcon');

      document.getElementById('summaryInitNums').innerText = `[ ${initA}, ${initB} ]`;
      document.getElementById('summaryGcd').innerText = finalGcd;
      document.getElementById('summaryRemain').innerText = `[ ${endA}, ${endB} ] (互質)`;

      if (isWinner) {
        icon.innerText = "🏆";
        title.innerText = "對決獲勝！";
        title.className = "text-2xl font-black text-amber-400 mb-1";
        desc.innerText = "完美洞悉互質時機，成功終結魔獸！";
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else {
        icon.innerText = "💀";
        title.innerText = "對決落敗！";
        title.className = "text-2xl font-black text-rose-500 mb-1";
        desc.innerText = "對手搶先看出互質並完成斬殺！";
      }

      modal.classList.remove('hidden');
    }

    // 點擊「再來一局」
    function requestRematch() {
      const btn = document.getElementById('btnRematch');
      const statusEl = document.getElementById('rematchStatus');

      rematchRequestedByMe = true;
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');

      if (rematchRequestedByPeer) {
        // 對方已先邀請，直接重開
        statusEl.innerText = "雙方同意，立即開局！";
        startNewRematchGame();
      } else {
        // 送出再戰請求
        statusEl.innerText = "已送出邀請，等待對手同意...";
        if (conn && conn.open) {
          conn.send({ type: 'REMATCH_REQUEST' });
        }
      }
    }

    // 收到對手的再戰請求
    function handleRematchRequest() {
      rematchRequestedByPeer = true;
      const statusEl = document.getElementById('rematchStatus');
      const btn = document.getElementById('btnRematch');

      if (rematchRequestedByMe) {
        startNewRematchGame();
      } else {
        statusEl.innerText = "🔥 對手邀請再來一局！";
        btn.classList.add('ring-2', 'ring-amber-400', 'animate-pulse');
      }
    }

    // 重新分發題目開局
    function startNewRematchGame() {
      const q = QUESTION_POOL[Math.floor(Math.random() * QUESTION_POOL.length)];
      if (conn && conn.open) {
        conn.send({ type: 'REMATCH_START', q: q });
      }
      document.getElementById('resultModal').classList.add('hidden');
      startGame(q[0], q[1]);
    }
  </script>
</body>
</html>
