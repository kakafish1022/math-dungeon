<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>地牢切怪 - 質因數雙人對決</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-3 select-none touch-manipulation">

  <!-- 頂部資訊列 -->
  <header class="w-full max-w-sm flex items-center justify-between py-2 border-b border-slate-700/60 text-xs">
    <div class="flex items-center gap-1.5 font-bold text-amber-400">
      <span>⚔️</span>
      <span>質因數雙人戰</span>
    </div>
    <div id="roomBadge" class="bg-slate-800 px-2 py-0.5 rounded text-slate-300 font-mono hidden">
      房號: <span id="displayRoomCode" class="text-amber-400 font-bold">----</span>
    </div>
  </header>

  <!-- 大廳畫面：開房 / 進房 -->
  <main id="lobbyScreen" class="w-full max-w-sm flex-1 flex flex-col justify-center items-center gap-4 my-auto">
    <div class="text-center">
      <div class="text-4xl mb-2">🗡️</div>
      <h2 class="text-xl font-black text-amber-400">質因數魔物・競速切怪</h2>
      <p class="text-xs text-slate-400 mt-1">選取正確質數神劍斬擊，最快將怪獸血量削至 1 者獲勝！</p>
    </div>

    <!-- 開房區塊 -->
    <div class="w-full bg-slate-800/80 p-4 rounded-2xl border border-slate-700 flex flex-col gap-3">
      <button type="button" id="btnCreateRoom" onclick="createRoom()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm tracking-wide shadow-lg active:scale-95 transition-all">
        🏠 建立房間（產生 4 碼）
      </button>
      <div id="createStatus" class="text-xs text-center text-amber-300 font-mono hidden"></div>
    </div>

    <div class="text-xs text-slate-500 font-bold">— 或是 —</div>

    <!-- 加入房間區塊 -->
    <div class="w-full bg-slate-800/80 p-4 rounded-2xl border border-slate-700 flex flex-col gap-2">
      <label class="text-xs text-slate-300 font-medium">輸入對手 4 碼房號：</label>
      <div class="flex gap-2">
        <input id="inputRoomCode" type="text" maxlength="4" placeholder="例如: 8821" 
          class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-center text-lg font-bold font-mono tracking-widest uppercase focus:outline-none focus:border-amber-400">
        <button type="button" onclick="joinRoom()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-sm active:scale-95 transition-all">
          加入
        </button>
      </div>
      <div id="joinStatus" class="text-xs text-center text-rose-400 font-medium hidden"></div>
    </div>

    <!-- 返回起始畫面 (回到 index.html) -->
    <a href="./index.html" class="w-full py-2.5 bg-slate-800/80 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-xl font-bold text-xs text-slate-300 text-center transition-all flex items-center justify-center gap-1.5 mt-1">
      <span>🏠</span>
      <span>返回遊戲大廳 (選擇其他模式)</span>
    </a>
  </main>

  <!-- 戰鬥畫面 (預設隱藏) -->
  <main id="battleScreen" class="w-full max-w-sm flex-1 flex flex-col justify-between hidden my-1">
    
    <!-- 對手狀態縮小條 -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-2 flex items-center justify-between text-xs">
      <span class="text-slate-400">對手剩餘血量:</span>
      <div class="flex items-center gap-2 font-mono">
        <span id="enemyHp" class="text-slate-300 font-bold">?</span>
        <span id="enemyStatus" class="text-emerald-400 text-[11px]">作戰中</span>
      </div>
    </div>

    <!-- 本地魔物中央顯示區 -->
    <div class="relative bg-slate-800 rounded-2xl border-2 border-slate-700 p-6 flex flex-col items-center justify-center my-auto shadow-inner">
      <div class="text-xs text-slate-400 font-medium mb-1">地牢魔物生命值</div>

      <!-- 單一數字怪物血量 -->
      <div class="w-full bg-slate-900/90 border border-amber-500/40 rounded-2xl py-6 text-center shadow-lg my-2">
        <div id="myHp" class="text-6xl font-black text-amber-400 font-mono tracking-tight">--</div>
      </div>

      <!-- 已分解質因數紀錄 -->
      <div class="text-xs text-slate-400 mt-2 flex items-center gap-1 font-mono">
        <span>已斬擊質因數:</span>
        <span id="factorsHistory" class="text-emerald-400 font-bold">無</span>
      </div>

      <!-- 彈刀懲罰遮罩 -->
      <div id="stunOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-1 hidden z-20">
        <div class="text-3xl animate-bounce">⚡</div>
        <div class="text-sm font-black text-rose-400">彈刀懲罰！</div>
        <div class="text-xs text-slate-300">無法整除，冷卻倒數: <span id="stunCount" class="font-bold text-amber-400">3</span> 秒</div>
      </div>
    </div>

    <!-- 下方神劍操作面板 (2, 3, 5, 7, 11) -->
    <div class="grid grid-cols-5 gap-1.5 w-full">
      <button type="button" onclick="slash(2)" class="slash-btn py-3 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-indigo-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-indigo-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-indigo-400 font-mono">2</span>
      </button>
      <button type="button" onclick="slash(3)" class="slash-btn py-3 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-emerald-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-emerald-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-emerald-400 font-mono">3</span>
      </button>
      <button type="button" onclick="slash(5)" class="slash-btn py-3 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-amber-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-amber-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-amber-400 font-mono">5</span>
      </button>
      <button type="button" onclick="slash(7)" class="slash-btn py-3 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-rose-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-rose-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-rose-400 font-mono">7</span>
      </button>
      <button type="button" onclick="slash(11)" class="slash-btn py-3 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-cyan-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-cyan-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-cyan-400 font-mono">11</span>
      </button>
    </div>

  </main>

  <!-- 放大版統一風格結算彈窗 -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-3 hidden z-50">
    <div class="max-w-sm w-full bg-slate-800 border-2 border-slate-700 rounded-3xl p-6 text-center flex flex-col items-center shadow-2xl">
      <div id="resultIcon" class="text-6xl mb-2">🏆</div>
      <h3 id="resultTitle" class="text-2xl font-black text-amber-400 mb-1">獲得勝利！</h3>
      <p id="resultDesc" class="text-xs text-slate-300 mb-4">最快完成質因數分解，成功消滅魔物！</p>

      <!-- 放大版數學短除法回顧區塊 -->
      <div class="w-full bg-slate-900/90 rounded-2xl p-4 border border-slate-700 text-left text-sm space-y-2 font-mono mb-5 shadow-inner">
        <div class="text-amber-400/90 text-xs font-bold border-b border-slate-700/60 pb-1 flex justify-between items-center">
          <span>短除法結算教學分析</span>
          <span class="text-[10px] text-slate-500">質因數分解</span>
        </div>
        
        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400">魔物原始血量：</span>
          <span id="summaryInitHp" class="text-amber-300 font-black text-sm"></span>
        </div>

        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-400">斬擊質因數乘積：</span>
          <span id="summaryFactorList" class="text-cyan-300 font-bold"></span>
        </div>

        <div class="pt-1 border-t border-slate-800 flex justify-between items-center">
          <span class="text-emerald-400 font-bold">標準分解式：</span>
          <span id="summaryPrimePower" class="text-emerald-400 font-black text-base"></span>
        </div>
      </div>

      <!-- 再戰提示狀態 -->
      <div id="rematchStatus" class="text-xs text-amber-300 font-medium mb-3 min-h-[1.25rem]"></div>

      <!-- 按鈕群 -->
      <div class="flex gap-2 w-full">
        <button type="button" id="btnRematch" onclick="requestRematch(event)" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm active:scale-95 transition-all">
          再來一局
        </button>
        <button type="button" onclick="leaveToLobby()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-sm text-slate-300 active:scale-95 transition-all">
          回大廳
        </button>
      </div>
    </div>
  </div>

  <footer class="w-full text-center py-1 text-[10px] text-slate-500">
    PeerJS P2P Prime Factorization Duel Engine
  </footer>

  <script>
    // 破除 BFCache 快取
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        window.location.reload();
      }
    });

    let peer = null;
    let conn = null;
    let isHost = false;
    let myHp = 0;
    let initHp = 0;
    let myFactors = [];
    let isStunned = false;
    let gameOver = false;

    let rematchRequestedByMe = false;
    let rematchRequestedByPeer = false;

    // 動態隨機生成質因數題目（2, 3, 5, 7, 11 組合，砍 3~4 刀）
    function generateRandomQuestion() {
      const primePool = [2, 2, 2, 3, 3, 3, 5, 5, 7, 11];
      const count = Math.floor(Math.random() * 2) + 3;
      let hp = 1;
      for (let i = 0; i < count; i++) {
        const p = primePool[Math.floor(Math.random() * primePool.length)];
        hp *= p;
      }
      if (hp > 1500 || hp < 20) {
        return generateRandomQuestion();
      }
      return hp;
    }

    // 計算標準分解式字串 (例如: 2³ × 3² × 5)
    function formatPrimePower(factors) {
      if (!factors || factors.length === 0) return '1';
      const counts = {};
      factors.forEach(p => counts[p] = (counts[p] || 0) + 1);
      
      const superscripts = { '1': '', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶' };
      const sortedKeys = Object.keys(counts).map(Number).sort((a, b) => a - b);
      
      return sortedKeys.map(p => {
        const c = counts[p];
        return c > 1 ? `${p}${superscripts[c] || '^' + c}` : `${p}`;
      }).join(' × ');
    }

    function generate4Code() {
      return Math.floor(1000 + Math.random() * 9000).toString();
    }

    function createRoom() {
      isHost = true;
      const code = generate4Code();
      const statusEl = document.getElementById('createStatus');
      statusEl.classList.remove('hidden');
      statusEl.innerText = "正在連線伺服器，分配房號...";

      peer = new Peer(code);

      peer.on('open', (id) => {
        statusEl.innerHTML = `房間已建立！你的 4 碼是：<strong class="text-amber-400 text-sm tracking-widest">${id}</strong><br>請讓對手輸入加入...`;
        document.getElementById('displayRoomCode').innerText = id;
        document.getElementById('roomBadge').classList.remove('hidden');
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
        const hp = generateRandomQuestion();
        setTimeout(() => {
          startGame(hp);
          conn.send({ type: 'START', hp: hp });
        }, 500);
      });

      peer.on('error', () => {
        statusEl.innerText = "開房失敗，請再試一次或重新整理。";
      });
    }

    function joinRoom() {
      isHost = false;
      const input = document.getElementById('inputRoomCode').value.trim();
      const statusEl = document.getElementById('joinStatus');
      if (input.length !== 4) {
        statusEl.innerText = "請輸入正確的 4 位數字房號！";
        statusEl.classList.remove('hidden');
        return;
      }

      statusEl.innerText = "連線對手中...";
      statusEl.classList.remove('hidden');

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect(input);
        setupConnection();
      });

      peer.on('error', () => {
        statusEl.innerText = "找不到該房號，請確認後重試。";
      });
    }

    function setupConnection() {
      conn.on('open', () => {
        document.getElementById('lobbyScreen').classList.add('hidden');
        document.getElementById('battleScreen').classList.remove('hidden');
      });

      conn.on('data', (data) => {
        if (!data) return;

        if (data.type === 'START') {
          startGame(data.hp);
        } else if (data.type === 'PROGRESS') {
          document.getElementById('enemyHp').innerText = data.hp;
        } else if (data.type === 'WIN') {
          triggerGameOver(false, data.factors);
        } else if (data.type === 'REMATCH_REQUEST') {
          handleRematchRequest();
        } else if (data.type === 'REMATCH_START') {
          document.getElementById('resultModal').classList.add('hidden');
          startGame(data.hp);
        }
      });
    }

    function startGame(hp) {
      myHp = hp;
      initHp = hp;
      myFactors = [];
      isStunned = false;
      gameOver = false;

      rematchRequestedByMe = false;
      rematchRequestedByPeer = false;

      const btn = document.getElementById('btnRematch');
      const statusEl = document.getElementById('rematchStatus');
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed', 'ring-2', 'ring-amber-400', 'animate-pulse');
        btn.innerText = "再來一局";
      }
      if (statusEl) statusEl.innerText = '';

      document.getElementById('enemyHp').innerText = hp;
      updateUI();
    }

    function updateUI() {
      document.getElementById('myHp').innerText = myHp;
      document.getElementById('factorsHistory').innerText = myFactors.length > 0 ? myFactors.join(' × ') : '無';
    }

    function slash(prime) {
      if (isStunned || gameOver) return;

      if (myHp % prime === 0) {
        myHp /= prime;
        myFactors.push(prime);
        updateUI();

        if (conn && conn.open) {
          conn.send({ type: 'PROGRESS', hp: myHp });
        }

        if (myHp === 1) {
          if (conn && conn.open) {
            conn.send({ type: 'WIN', factors: myFactors });
          }
          triggerGameOver(true, myFactors);
        }
      } else {
        triggerStun(3);
      }
    }

    function triggerStun(seconds) {
      isStunned = true;
      const overlay = document.getElementById('stunOverlay');
      const countEl = document.getElementById('stunCount');
      overlay.classList.remove('hidden');

      let remaining = seconds;
      countEl.innerText = remaining;

      const timer = setInterval(() => {
        remaining--;
        countEl.innerText = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          overlay.classList.add('hidden');
          isStunned = false;
        }
      }, 1000);
    }

    function triggerGameOver(isWinner, finalFactors) {
      gameOver = true;
      const modal = document.getElementById('resultModal');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const icon = document.getElementById('resultIcon');

      const usedFactors = finalFactors || myFactors;

      document.getElementById('summaryInitHp').innerText = initHp;
      document.getElementById('summaryFactorList').innerText = usedFactors.join(' × ');
      document.getElementById('summaryPrimePower').innerText = formatPrimePower(usedFactors);

      if (isWinner) {
        icon.innerText = "🏆";
        title.innerText = "對決獲勝！";
        title.className = "text-2xl font-black text-amber-400 mb-1";
        desc.innerText = "最快完成質因數分解，成功消滅魔物！";
        try { confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); } catch(e){}
      } else {
        icon.innerText = "💀";
        title.innerText = "對決落敗！";
        title.className = "text-2xl font-black text-rose-500 mb-1";
        desc.innerText = "對手搶先一步斬殺完成！";
      }

      modal.classList.remove('hidden');
    }

    function requestRematch(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('btnRematch');
      const statusEl = document.getElementById('rematchStatus');

      rematchRequestedByMe = true;
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      btn.innerText = "等待對手中...";

      if (conn && conn.open) {
        conn.send({ type: 'REMATCH_REQUEST' });
      }

      if (rematchRequestedByPeer) {
        statusEl.innerText = "雙方同意，準備開局...";
        checkAndLaunchRematch();
      } else {
        statusEl.innerText = "已送出邀請，等待對手點擊同意...";
      }
    }

    function handleRematchRequest() {
      rematchRequestedByPeer = true;
      const statusEl = document.getElementById('rematchStatus');
      const btn = document.getElementById('btnRematch');

      if (rematchRequestedByMe) {
        statusEl.innerText = "雙方同意，準備開局...";
        checkAndLaunchRematch();
      } else {
        statusEl.innerText = "🔥 對手邀請再來一局！請點擊同意";
        btn.classList.add('ring-2', 'ring-amber-400', 'animate-pulse');
        btn.innerText = "同意再來一局";
      }
    }

    function checkAndLaunchRematch() {
      if (isHost) {
        const hp = generateRandomQuestion();
        setTimeout(() => {
          if (conn && conn.open) {
            conn.send({ type: 'REMATCH_START', hp: hp });
          }
          document.getElementById('resultModal').classList.add('hidden');
          startGame(hp);
        }, 600);
      }
    }

    function leaveToLobby() {
      window.location.reload();
    }
  </script>
</body>
</html>
