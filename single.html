<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>地牢切怪 - 單人試煉場</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-3 select-none touch-manipulation">

  <!-- 頂部資訊列 -->
  <header class="w-full max-w-sm flex items-center justify-between py-2 border-b border-slate-700/60 text-xs">
    <div class="flex items-center gap-1.5 font-bold text-amber-400">
      <span id="headerIcon">🏰</span>
      <span id="headerTitle">單人試煉地牢</span>
    </div>
    
    <!-- 儀表狀態 (五關跑正計時，無盡跑倒數計時) -->
    <div id="meterContainer" class="flex items-center gap-1 font-mono bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 hidden">
      <span id="meterLabel" class="text-slate-400 text-[10px]">TIME</span>
      <span id="meterDisplay" class="text-amber-400 font-bold text-sm tracking-wider">00.00</span>
      <span id="meterUnit" class="text-[10px] text-slate-400">s</span>
    </div>
  </header>

  <!-- 1. 模式選擇大廳 -->
  <main id="modeSelectScreen" class="w-full max-w-sm flex-1 flex flex-col justify-center items-center gap-4 my-auto">
    <div class="text-center">
      <div class="text-4xl mb-2">🗡️</div>
      <h2 class="text-xl font-black text-amber-400">地牢試煉領域</h2>
      <p class="text-xs text-slate-400 mt-1">磨練質因數心算神技，選擇你的修行模式！</p>
    </div>

    <!-- 模式卡片：五關競速試煉 -->
    <button type="button" onclick="startFiveStagesMode()" class="w-full bg-slate-800/90 hover:bg-slate-800 active:scale-95 border-2 border-indigo-500/50 hover:border-indigo-400 p-4 rounded-2xl flex flex-col text-left transition-all shadow-lg">
      <div class="flex items-center justify-between w-full mb-1">
        <span class="text-base font-black text-indigo-400 flex items-center gap-1.5">
          <span>👑</span> 五關競速試煉
        </span>
        <span class="text-[10px] bg-indigo-950/80 text-indigo-300 border border-indigo-700 px-2 py-0.5 rounded-full font-bold">階梯闖關</span>
      </div>
      <p class="text-xs text-slate-300">擊破 B1~B5 五層魔物（含 11 質數考驗），爭奪最速 S 級段位！</p>
    </button>

    <!-- 模式卡片：無盡深淵生存 -->
    <button type="button" onclick="startEndlessMode()" class="w-full bg-slate-800/90 hover:bg-slate-800 active:scale-95 border-2 border-rose-500/50 hover:border-rose-400 p-4 rounded-2xl flex flex-col text-left transition-all shadow-lg">
      <div class="flex items-center justify-between w-full mb-1">
        <span class="text-base font-black text-rose-400 flex items-center gap-1.5">
          <span>⏳</span> 無盡深淵生存
        </span>
        <span class="text-[10px] bg-rose-950/80 text-rose-300 border border-rose-700 px-2 py-0.5 rounded-full font-bold">極限狂暴</span>
      </div>
      <p class="text-xs text-slate-300">初始 45 秒倒數！每斬殺一隻魔物延長 4 秒，挑戰最高連斬與刷怪總量！</p>
    </button>

    <!-- 本地英雄榜預覽 -->
    <div class="w-full bg-slate-800/50 p-3 rounded-xl border border-slate-700/60 text-xs">
      <div class="text-slate-400 font-bold mb-2 flex items-center justify-between">
        <span>🏆 本機最佳成績紀錄</span>
        <span class="text-[10px] text-slate-500">自動保存於本手機</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-[11px] font-mono">
        <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700/40">
          <div class="text-indigo-400 font-bold">五關最速紀錄</div>
          <div id="lobbyBestSpeed" class="text-slate-300 mt-1">無紀錄</div>
        </div>
        <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700/40">
          <div class="text-rose-400 font-bold">無盡最高斬殺</div>
          <div id="lobbyBestEndless" class="text-slate-300 mt-1">無紀錄</div>
        </div>
      </div>
    </div>
  </main>

  <!-- 2. 戰鬥畫面 (預設隱藏) -->
  <main id="battleScreen" class="w-full max-w-sm flex-1 flex flex-col justify-between hidden my-auto">
    
    <!-- 五關模式：樓層進度指示器 -->
    <div id="stageProgressBar" class="flex items-center justify-between gap-1 text-[11px] font-bold my-1">
      <div id="stageDot0" class="flex-1 py-1 rounded text-center bg-amber-500 text-slate-950">B1</div>
      <div id="stageDot1" class="flex-1 py-1 rounded text-center bg-slate-800 text-slate-500">B2</div>
      <div id="stageDot2" class="flex-1 py-1 rounded text-center bg-slate-800 text-slate-500">B3</div>
      <div id="stageDot3" class="flex-1 py-1 rounded text-center bg-slate-800 text-slate-500">B4</div>
      <div id="stageDot4" class="flex-1 py-1 rounded text-center bg-slate-800 text-slate-500">B5</div>
    </div>

    <!-- 無盡模式：擊破數與連擊指示條 -->
    <div id="endlessStatusBar" class="flex items-center justify-between bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700 text-xs hidden my-1 font-mono">
      <div>已擊破: <span id="endlessKillCount" class="text-amber-400 font-black text-sm">0</span> 隻</div>
      <div>連擊: <span id="endlessComboCount" class="text-rose-400 font-black text-sm">0</span> Combo</div>
    </div>

    <!-- 魔物戰鬥中央卡片 -->
    <div class="relative bg-slate-800 rounded-2xl border-2 border-slate-700 p-5 flex flex-col items-center justify-center shadow-inner my-auto">
      
      <!-- 魔物名稱與圖示 -->
      <div class="flex items-center gap-2 mb-1">
        <span id="monsterIcon" class="text-3xl animate-pulse">🟢</span>
        <div>
          <h2 id="monsterName" class="text-base font-black text-amber-400">B1 史萊姆</h2>
          <p id="monsterDesc" class="text-[10px] text-slate-400">基礎暖身：2、3 的小倍數</p>
        </div>
      </div>

      <!-- 魔物生命值 -->
      <div class="w-full bg-slate-900/90 border border-amber-500/40 rounded-2xl py-6 text-center shadow-lg my-3">
        <div id="monsterHp" class="text-6xl font-black text-amber-400 font-mono tracking-tight transition-transform duration-100">--</div>
      </div>

      <!-- 已斬擊質因數紀錄 -->
      <div class="text-xs text-slate-400 mt-1 flex items-center gap-1 font-mono">
        <span>已斬擊質因數:</span>
        <span id="factorsHistory" class="text-emerald-400 font-bold">無</span>
      </div>

      <!-- 彈刀懲罰遮罩 -->
      <div id="stunOverlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-1 hidden z-20">
        <div class="text-3xl animate-bounce">⚡</div>
        <div class="text-sm font-black text-rose-400">彈刀懲罰！連擊歸零！</div>
        <div class="text-xs text-slate-300">無法整除，冷卻倒數: <span id="stunCount" class="font-bold text-amber-400">3</span> 秒</div>
      </div>
    </div>

    <!-- 下方神劍操作面板 (2, 3, 5, 7, 11) -->
    <div class="grid grid-cols-5 gap-1.5 w-full mt-2">
      <button type="button" onclick="slash(2)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-indigo-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-indigo-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-indigo-400 font-mono">2</span>
      </button>
      <button type="button" onclick="slash(3)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-emerald-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-emerald-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-emerald-400 font-mono">3</span>
      </button>
      <button type="button" onclick="slash(5)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-amber-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-amber-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-amber-400 font-mono">5</span>
      </button>
      <button type="button" onclick="slash(7)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-rose-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-rose-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-rose-400 font-mono">7</span>
      </button>
      <button type="button" onclick="slash(11)" class="slash-btn py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-90 border-2 border-cyan-500/50 rounded-xl flex flex-col items-center justify-center transition-all">
        <span class="text-[9px] text-cyan-300 font-semibold">神劍</span>
        <span class="text-xl font-black text-cyan-400 font-mono">11</span>
      </button>
    </div>

  </main>

  <!-- 3. 結算彈窗 -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-3 hidden z-50">
    <div class="max-w-sm w-full bg-slate-800 border-2 border-slate-700 rounded-3xl p-5 text-center flex flex-col items-center shadow-2xl max-h-[92vh] overflow-y-auto">
      
      <!-- 勳章與主標 -->
      <div id="resultIcon" class="text-5xl mb-1">👑</div>
      <div id="resultMainTitle" class="text-2xl font-black text-amber-400 tracking-wider">試煉完成！</div>
      <div id="resultSubTitle" class="text-xs text-amber-300 font-bold mb-1">神速・質因數劍豪</div>
      <div id="newRecordBanner" class="text-xs font-black text-rose-400 animate-pulse mb-3 hidden">🔥 NEW RECORD! 突破本機歷史紀錄！</div>

      <!-- 戰績總結卡片 -->
      <div id="summaryCard" class="w-full bg-slate-900/90 rounded-2xl p-3 border border-slate-700 text-left text-xs font-mono mb-3 space-y-1.5 shadow-inner">
        <!-- 動態依模式填入 -->
      </div>

      <!-- 本機排行榜 Top 3 -->
      <div class="w-full bg-slate-900/50 rounded-xl p-2.5 border border-slate-700/60 text-left text-[11px] mb-4">
        <div class="text-slate-400 font-bold mb-1 flex items-center justify-between">
          <span id="leaderboardTitle">🏆 本機英雄榜 (Top 3)</span>
          <span class="text-[9px] text-slate-500">保存在本手機</span>
        </div>
        <div id="leaderboardList" class="space-y-1 font-mono text-slate-300">
          <!-- 動態插入榜單 -->
        </div>
      </div>

      <!-- 控制按鈕 -->
      <div class="flex gap-2 w-full">
        <button type="button" onclick="retryCurrentMode()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm active:scale-95 transition-all">
          再次挑戰
        </button>
        <button type="button" onclick="backToModeSelect()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-sm text-slate-300 active:scale-95 transition-all">
          回主選單
        </button>
      </div>
    </div>
  </div>

  <footer class="w-full text-center py-1 text-[10px] text-slate-500">
    Math Dungeon Dual-Mode Engine
  </footer>

  <script>
    // 破除往返快取
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        window.location.reload();
      }
    });

    // 遊戲狀態模式: 'STAGES' 或 'ENDLESS'
    let currentMode = 'STAGES';

    // 五關關卡設定
    const FIVE_STAGES = [
      { floor: 'B1', name: 'B1 史萊姆', icon: '🟢', desc: '基礎暖身：2、3 的小倍數', pool: [2, 2, 3, 3], cuts: [2, 2], maxLimit: 60 },
      { floor: 'B2', name: 'B2 骷髏兵', icon: '💀', desc: '倍數混合：加入 5 的因數', pool: [2, 3, 5, 5], cuts: [2, 3], maxLimit: 150 },
      { floor: 'B3', name: 'B3 哥布林精銳', icon: '👺', desc: '進階考驗：加入 7 的質因數', pool: [2, 3, 5, 7, 7], cuts: [3, 4], maxLimit: 450 },
      { floor: 'B4', name: 'B4 石巨人領主', icon: '🗿', desc: '巨額血量：多重質因數混搭', pool: [2, 3, 5, 7, 7], cuts: [3, 4], maxLimit: 1000 },
      { floor: 'B5', name: 'B5 深淵黑龍王', icon: '🐲', desc: '極限首領：必含 11 奇偶位差考驗', pool: [2, 3, 5, 7, 11, 11], cuts: [3, 4], maxLimit: 1500, mustInclude: 11 }
    ];

    let stageIndex = 0;
    let currentHp = 0;
    let currentInitHp = 0;
    let stageFactors = [];
    let stagesRecord = [];

    // 無盡模式狀態
    let endlessKills = 0;
    let currentCombo = 0;
    let maxCombo = 0;
    let endlessTimeRemaining = 45.0;

    // 通用計時器
    let timerInterval = null;
    let speedStartTime = null;
    let isTimerRunning = false;
    let isStunned = false;

    // 隨機魔物血量生成演算法
    function generateMonsterHp(pool, minCuts, maxCuts, maxLimit, mustInclude = null) {
      const cuts = Math.floor(Math.random() * (maxCuts - minCuts + 1)) + minCuts;
      let factors = [];
      if (mustInclude) factors.push(mustInclude);

      while (factors.length < cuts) {
        factors.push(pool[Math.floor(Math.random() * pool.length)]);
      }

      const hp = factors.reduce((acc, v) => acc * v, 1);
      if (hp > maxLimit || hp < 12) {
        return generateMonsterHp(pool, minCuts, maxCuts, maxLimit, mustInclude);
      }
      return hp;
    }

    // 計算標準分解式字串
    function formatPrimePower(factors) {
      if (!factors || factors.length === 0) return '1';
      const counts = {};
      factors.forEach(p => counts[p] = (counts[p] || 0) + 1);
      const superscripts = { '1': '', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶' };
      const sortedKeys = Object.keys(counts).map(Number).sort((a, b) => a - b);
      return sortedKeys.map(p => {
        const c = counts[p];
        return c > 1 ? `${p}${superscripts[c] || '^' + c}` : `${p}`;
      }).join(' × ');
    }

    // 更新大廳紀錄預覽
    function updateLobbyPreview() {
      const speedRecords = JSON.parse(localStorage.getItem('dungeon_speed_records') || '[]');
      const endlessRecords = JSON.parse(localStorage.getItem('dungeon_endless_records') || '[]');
      
      document.getElementById('lobbyBestSpeed').innerText = speedRecords.length > 0 ? `${speedRecords[0].toFixed(2)} 秒` : '無紀錄';
      document.getElementById('lobbyBestEndless').innerText = endlessRecords.length > 0 ? `${endlessRecords[0]} 隻魔物` : '無紀錄';
    }

    // 切換回主選單
    function backToModeSelect() {
      clearInterval(timerInterval);
      document.getElementById('battleScreen').classList.add('hidden');
      document.getElementById('resultModal').classList.add('hidden');
      document.getElementById('meterContainer').classList.add('hidden');
      document.getElementById('modeSelectScreen').classList.remove('hidden');
      document.getElementById('headerTitle').innerText = "單人試煉地牢";
      updateLobbyPreview();
    }

    // 啟動五關競速模式
    function startFiveStagesMode() {
      currentMode = 'STAGES';
      stageIndex = 0;
      stagesRecord = [];
      isTimerRunning = false;
      clearInterval(timerInterval);

      document.getElementById('modeSelectScreen').classList.add('hidden');
      document.getElementById('battleScreen').classList.remove('hidden');
      document.getElementById('stageProgressBar').classList.remove('hidden');
      document.getElementById('endlessStatusBar').classList.add('hidden');

      document.getElementById('headerTitle').innerText = "五關競速試煉";
      document.getElementById('meterContainer').classList.remove('hidden');
      document.getElementById('meterLabel').innerText = "TIME";
      document.getElementById('meterDisplay').innerText = "00.00";
      document.getElementById('meterUnit').innerText = "s";

      loadFiveStage(stageIndex);
    }

    function loadFiveStage(idx) {
      const stage = FIVE_STAGES[idx];
      currentHp = generateMonsterHp(stage.pool, stage.cuts[0], stage.cuts[1], stage.maxLimit, stage.mustInclude);
      currentInitHp = currentHp;
      stageFactors = [];
      isStunned = false;

      // 更新五點進度條
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`stageDot${i}`);
        if (i < idx) {
          dot.className = "flex-1 py-1 rounded text-center bg-emerald-600 text-white";
          dot.innerText = `✓`;
        } else if (i === idx) {
          dot.className = "flex-1 py-1 rounded text-center bg-amber-500 text-slate-950 animate-pulse font-black";
          dot.innerText = FIVE_STAGES[i].floor;
        } else {
          dot.className = "flex-1 py-1 rounded text-center bg-slate-800 text-slate-500";
          dot.innerText = FIVE_STAGES[i].floor;
        }
      }

      document.getElementById('monsterIcon').innerText = stage.icon;
      document.getElementById('monsterName').innerText = stage.name;
      document.getElementById('monsterDesc').innerText = stage.desc;
      updateUI();
    }

    // 啟動無盡深淵模式
    function startEndlessMode() {
      currentMode = 'ENDLESS';
      endlessKills = 0;
      currentCombo = 0;
      maxCombo = 0;
      endlessTimeRemaining = 45.0;
      isTimerRunning = false;
      clearInterval(timerInterval);

      document.getElementById('modeSelectScreen').classList.add('hidden');
      document.getElementById('battleScreen').classList.remove('hidden');
      document.getElementById('stageProgressBar').classList.add('hidden');
      document.getElementById('endlessStatusBar').classList.remove('hidden');

      document.getElementById('headerTitle').innerText = "無盡深淵生存";
      document.getElementById('meterContainer').classList.remove('hidden');
      document.getElementById('meterLabel').innerText = "倒數";
      document.getElementById('meterDisplay').innerText = endlessTimeRemaining.toFixed(1);
      document.getElementById('meterUnit').innerText = "s";

      document.getElementById('endlessKillCount').innerText = "0";
      document.getElementById('endlessComboCount').innerText = "0";

      loadEndlessMonster();
    }

    function loadEndlessMonster() {
      // 依擊破數階梯提升難度
      let pool = [2, 2, 3, 3, 5];
      let minC = 2, maxC = 3;
      let limit = 200;

      if (endlessKills >= 5) {
        pool.push(7, 7);
        minC = 3; maxC = 4;
        limit = 600;
      }
      if (endlessKills >= 12) {
        pool.push(11, 11);
        minC = 3; maxC = 4;
        limit = 1500;
      }

      currentHp = generateMonsterHp(pool, minC, maxC, limit);
      currentInitHp = currentHp;
      stageFactors = [];
      isStunned = false;

      const monsterTitles = ['深淵史萊姆', '狂暴哥布林', '煉獄骷髏', '暗黑石像鬼', '遠古魔龍'];
      const icons = ['👾', '👹', '💀', '🦇', '🐲'];
      const chosen = Math.min(Math.floor(endlessKills / 4), 4);

      document.getElementById('monsterIcon').innerText = icons[chosen];
      document.getElementById('monsterName').innerText = `${monsterTitles[chosen]} Lv.${endlessKills + 1}`;
      document.getElementById('monsterDesc').innerText = `擊破 +4 秒！目前連擊: ${currentCombo} Combo`;
      updateUI();
    }

    function updateUI() {
      document.getElementById('monsterHp').innerText = currentHp;
      document.getElementById('factorsHistory').innerText = stageFactors.length > 0 ? stageFactors.join(' × ') : '無';
    }

    // 揮動神劍斬擊
    function slash(prime) {
      if (isStunned) return;

      // 啟動對應計時機制
      if (!isTimerRunning) {
        isTimerRunning = true;
        if (currentMode === 'STAGES') {
          speedStartTime = performance.now();
          timerInterval = setInterval(() => {
            const elapsed = (performance.now() - speedStartTime) / 1000;
            document.getElementById('meterDisplay').innerText = elapsed.toFixed(2);
          }, 30);
        } else {
          timerInterval = setInterval(() => {
            endlessTimeRemaining -= 0.1;
            if (endlessTimeRemaining <= 0) {
              endlessTimeRemaining = 0;
              clearInterval(timerInterval);
              finishEndlessGame();
            }
            document.getElementById('meterDisplay').innerText = endlessTimeRemaining.toFixed(1);
          }, 100);
        }
      }

      // 整除判定
      if (currentHp % prime === 0) {
        currentHp /= prime;
        stageFactors.push(prime);
        currentCombo++;
        if (currentCombo > maxCombo) maxCombo = currentCombo;

        if (currentMode === 'ENDLESS') {
          document.getElementById('endlessComboCount').innerText = currentCombo;
        }

        // 數值打擊特效
        const hpEl = document.getElementById('monsterHp');
        hpEl.classList.add('scale-110', 'text-emerald-400');
        setTimeout(() => hpEl.classList.remove('scale-110', 'text-emerald-400'), 120);

        updateUI();

        // 削至 1 擊倒魔物
        if (currentHp === 1) {
          if (currentMode === 'STAGES') {
            stagesRecord.push({
              floor: FIVE_STAGES[stageIndex].floor,
              initHp: currentInitHp,
              factors: [...stageFactors]
            });

            if (stageIndex < FIVE_STAGES.length - 1) {
              stageIndex++;
              loadFiveStage(stageIndex);
            } else {
              finishStagesGame();
            }
          } else {
            // 無盡模式加時間與累加計數
            endlessKills++;
            endlessTimeRemaining += 4.0;
            document.getElementById('endlessKillCount').innerText = endlessKills;
            loadEndlessMonster();
          }
        }
      } else {
        // 彈刀處罰：罰停 3 秒，連擊歸零
        currentCombo = 0;
        if (currentMode === 'ENDLESS') {
          document.getElementById('endlessComboCount').innerText = 0;
        }
        triggerStun(3);
      }
    }

    // 彈刀凍結懲罰
    function triggerStun(seconds) {
      isStunned = true;
      const overlay = document.getElementById('stunOverlay');
      const countEl = document.getElementById('stunCount');
      overlay.classList.remove('hidden');

      let remaining = seconds;
      countEl.innerText = remaining;

      const timer = setInterval(() => {
        remaining--;
        countEl.innerText = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          overlay.classList.add('hidden');
          isStunned = false;
        }
      }, 1000);
    }

    // 五關模式通關結算
    function finishStagesGame() {
      clearInterval(timerInterval);
      const totalTime = ((performance.now() - speedStartTime) / 1000).toFixed(2);
      const secNum = parseFloat(totalTime);

      // 段位評估 (35s內S級, 55s內A級, 80s內B級)
      let tier = "S 級", title = "神速・質因數劍豪", icon = "⚡", color = "text-amber-400";
      if (secNum >= 80.0) {
        tier = "C 級"; title = "頑強・見習生"; icon = "🩹"; color = "text-slate-400";
      } else if (secNum >= 55.0) {
        tier = "B 級"; title = "熟練・冒險者"; icon = "🛡️"; color = "text-indigo-400";
      } else if (secNum >= 35.0) {
        tier = "A 級"; title = "精銳・地牢先鋒"; icon = "🗡️"; color = "text-emerald-400";
      }

      document.getElementById('resultIcon').innerText = icon;
      document.getElementById('resultMainTitle').innerText = `${tier} 達成！`;
      document.getElementById('resultMainTitle').className = `text-2xl font-black ${color} tracking-wider`;
      document.getElementById('resultSubTitle').innerText = title;

      // 戰績教學卡片
      let detailsHtml = `
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-1">
          <span class="text-slate-400">通關總時間：</span>
          <span class="text-amber-300 font-black text-base">${totalTime} 秒</span>
        </div>
      `;
      stagesRecord.forEach(st => {
        detailsHtml += `
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-slate-400">${st.floor}:</span>
            <span class="text-emerald-400 font-bold">${st.initHp} = ${formatPrimePower(st.factors)}</span>
          </div>
        `;
      });
      document.getElementById('summaryCard').innerHTML = detailsHtml;

      // 本機榜單處理
      const isNewBest = saveSpeedRecord(secNum);
      handleRecordBanner(isNewBest);
      renderLeaderboard('SPEED');

      try { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); } catch(e){}
      document.getElementById('resultModal').classList.remove('hidden');
    }

    // 無盡模式陣亡結算
    function finishEndlessGame() {
      document.getElementById('resultIcon').innerText = "⏳";
      document.getElementById('resultMainTitle').innerText = "時間耗盡！";
      document.getElementById('resultMainTitle').className = "text-2xl font-black text-rose-400 tracking-wider";
      document.getElementById('resultSubTitle').innerText = `深入深淵，斬殺 ${endlessKills} 隻魔物！`;

      document.getElementById('summaryCard').innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-1">
          <span class="text-slate-400">總斬殺數量：</span>
          <span class="text-amber-400 font-black text-lg">${endlessKills} 隻</span>
        </div>
        <div class="flex justify-between items-center text-xs pt-1">
          <span class="text-slate-400">最高零失誤連擊：</span>
          <span class="text-cyan-400 font-black text-base">${maxCombo} Combo</span>
        </div>
      `;

      const isNewBest = saveEndlessRecord(endlessKills);
      handleRecordBanner(isNewBest);
      renderLeaderboard('ENDLESS');

      document.getElementById('resultModal').classList.remove('hidden');
    }

    function handleRecordBanner(isNew) {
      const banner = document.getElementById('newRecordBanner');
      if (isNew) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    }

    // 儲存五關紀錄
    function saveSpeedRecord(sec) {
      let records = JSON.parse(localStorage.getItem('dungeon_speed_records') || '[]');
      let isBest = records.length === 0 || sec < records[0];
      records.push(sec);
      records.sort((a, b) => a - b);
      records = records.slice(0, 3);
      localStorage.setItem('dungeon_speed_records', JSON.stringify(records));
      return isBest;
    }

    // 儲存無盡紀錄
    function saveEndlessRecord(kills) {
      let records = JSON.parse(localStorage.getItem('dungeon_endless_records') || '[]');
      let isBest = records.length === 0 || kills > records[0];
      records.push(kills);
      records.sort((a, b) => b - a);
      records = records.slice(0, 3);
      localStorage.setItem('dungeon_endless_records', JSON.stringify(records));
      return isBest;
    }

    // 渲染本機榜單
    function renderLeaderboard(type) {
      const titleEl = document.getElementById('leaderboardTitle');
      const listEl = document.getElementById('leaderboardList');
      const medals = ['🥇 第一名', '🥈 第二名', '🥉 第三名'];

      if (type === 'SPEED') {
        titleEl.innerText = "🏆 五關競速榜 (Top 3)";
        const recs = JSON.parse(localStorage.getItem('dungeon_speed_records') || '[]');
        if (recs.length === 0) { listEl.innerHTML = `<div class="text-slate-500">暫無通關紀錄</div>`; return; }
        listEl.innerHTML = recs.map((s, i) => `
          <div class="flex justify-between items-center py-0.5">
            <span>${medals[i]}</span>
            <span class="font-bold text-amber-400">${s.toFixed(2)} 秒</span>
          </div>
        `).join('');
      } else {
        titleEl.innerText = "🏆 無盡斬殺榜 (Top 3)";
        const recs = JSON.parse(localStorage.getItem('dungeon_endless_records') || '[]');
        if (recs.length === 0) { listEl.innerHTML = `<div class="text-slate-500">暫無斬殺紀錄</div>`; return; }
        listEl.innerHTML = recs.map((k, i) => `
          <div class="flex justify-between items-center py-0.5">
            <span>${medals[i]}</span>
            <span class="font-bold text-rose-400">${k} 隻魔物</span>
          </div>
        `).join('');
      }
    }

    // 再次挑戰當前模式
    function retryCurrentMode() {
      document.getElementById('resultModal').classList.add('hidden');
      if (currentMode === 'STAGES') startFiveStagesMode();
      else startEndlessMode();
    }

    // 初始載入
    window.onload = updateLobbyPreview;
  </script>
</body>
</html>
